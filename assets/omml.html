<body>
  <header class="omml-header">
    <div class="omml-header-inner">
      <div class="omml-title">
        <span>📑 OMML 數學方程式庫</span>
        <span style="font-size:12px;font-weight:400;color:#64748b;background:#e0f2fe;padding:2px 8px;border-radius:12px;">微軟原生 Word 方程式</span>
      </div>
      <div class="omml-nav-links">
        <a href="vectors.html" class="nav-btn nav-btn-vec">📘 空間向量篇 ›</a>
        <a href="calculus.html" class="nav-btn nav-btn-calc">📐 微積分篇 ›</a>
        <a href="index.html" class="nav-btn nav-btn-jae">🎯 四校聯考歷屆真題 ›</a>
        <a href="高三理組數學思維本_空間向量_參考答案_OMML對照手冊.docx" class="nav-btn nav-btn-download" download>📥 空間向量手冊 (.docx)</a>
        <a href="微積分思維本_參考答案_OMML對照手冊.docx" class="nav-btn nav-btn-download" download>📥 微積分手冊 (.docx)</a>
      </div>
    </div>
  </header>

  <div class="omml-container">
    <div class="filter-bar">
      <div class="filter-btn-group" id="filterGroup">
        <button class="filter-btn active" data-filter="all">全部專題 (<span id="totalCardsCount">0</span>)</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋題號、專題、題目或公式..." />
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="toast" id="toast">✓ 已成功複製微軟 Word 原生 OMML 方程式代碼！</div>

  <!-- 數據庫加載 -->
  <script src="ch-vec-01.js?v=20260925"></script>
  <script src="ch-vec-02.js?v=20260925"></script>
  <script src="ch-vec-03.js?v=20260925"></script>
  <script src="ch-vec-04.js?v=20260925"></script>
  <script src="ch-vec-05.js?v=20260925"></script>
  <script src="ch-calc-01.js?v=20260925"></script>
  <script src="ch-calc-02.js?v=20260925"></script>
  <script src="ch-calc-03.js?v=20260925"></script>
  <script src="ch-calc-04.js?v=20260925"></script>
  <script src="ch-calc-05.js?v=20260925"></script>
  <script src="ch-calc-06.js?v=20260925"></script>

  <script>
    const DECK = window.DECK || [];
    let CARDS = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // 解析所有題目數據
    DECK.forEach((chapter, chIdx) => {
      const chColor = chapter.color || '#0284c7';
      const chTitle = chapter.title || chapter.ch || `專題 ${chIdx+1}`;
      const chId = 'ch_' + chIdx;

      (chapter.slides || []).forEach((slide, sIdx) => {
        const sol = slide.solution || {};
        CARDS.push({
          chapId: chId,
          chapTitle: chTitle,
          color: chColor,
          qNum: slide.qNum || `第${sIdx+1}題`,
          topic: slide.topic || '',
          q: slide.q || '',
          ans: sol.ans || '',
          omml: sol.omml || '',
          score: slide.score || ''
        });
      });
    });

    document.getElementById('totalCardsCount').textContent = CARDS.length;

    // 動態生成篩選按鈕
    const filterGroup = document.getElementById('filterGroup');
    DECK.forEach((chapter, chIdx) => {
      const chTitle = chapter.ch || `專題 ${chIdx+1}`;
      const count = (chapter.slides || []).length;
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.setAttribute('data-filter', 'ch_' + chIdx);
      btn.textContent = `${chTitle.split(' ')[0]} (${count})`;
      filterGroup.appendChild(btn);
    });

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const filtered = CARDS.filter(c => {
        const matchChap = (currentFilter === 'all') || (c.chapId === currentFilter);
        const matchSearch = !searchQuery || 
          c.qNum.includes(searchQuery) || 
          c.topic.includes(searchQuery) || 
          c.q.includes(searchQuery) || 
          c.ans.includes(searchQuery);
        return matchChap && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">查無相符的試題方程式</div>';
        return;
      }

      grid.innerHTML = filtered.map((c, i) => `
        <div class="omml-card" data-chap="${c.chapId}">
          <div class="card-top">
            <div>
              <span class="badge-q" style="background:${c.color}">${c.qNum}</span>
              <div class="card-topic">${c.chapTitle.split(' ')[0]} · ${c.topic}</div>
            </div>
            ${c.score ? `<span style="font-size:11px;color:#94a3b8;">${c.score}</span>` : ''}
          </div>
          <div class="card-q">${c.q}</div>
          <div class="card-ans-box">
            <div class="card-ans-math">${c.ans.startsWith('$') ? c.ans : `$${c.ans}$`}</div>
            <button class="btn-copy-omml" onclick="copyCardOMML(this, ${i})">📋 複製 OMML</button>
          </div>
          <div class="code-toggle" onclick="toggleCode(this)">展開/收合 OMML XML 代碼</div>
          <pre class="code-box"><code>${escapeHtml(c.omml)}</code></pre>
        </div>
      `).join('');

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([grid]);
      }
    }

    function toggleCode(btn) {
      const codeBox = btn.nextElementSibling;
      const isBlock = codeBox.style.display === 'block';
      codeBox.style.display = isBlock ? 'none' : 'block';
      btn.textContent = isBlock ? '展開/收合 OMML XML 代碼' : '收合 OMML XML 代碼';
    }

    function copyCardOMML(btn, idx) {
      const card = CARDS[idx];
      if (!card || !card.omml) return;
      
      const copyText = card.omml;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(() => {
          showCopied(btn);
        }).catch(() => {
          fallbackCopy(copyText, btn);
        });
      } else {
        fallbackCopy(copyText, btn);
      }
    }

    function fallbackCopy(text, btn) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showCopied(btn);
    }

    function showCopied(btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ 已複製！';
      btn.classList.add('copied');
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
        toast.classList.remove('show');
      }, 2000);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    filterGroup.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderCards();
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderCards();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderCards();
    });
  </script>
</body>
